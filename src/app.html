<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
			crossorigin
		/>
		<script>
			// Apply the theme before first paint so the page never flashes the wrong colors.
			(function () {
				var root = document.documentElement;
				var theme = 'dark';
				try {
					theme = localStorage.getItem('theme');
					if (theme !== 'light' && theme !== 'dark') {
						// Honor the toggle state saved by the previous version of the site.
						var legacy = localStorage.getItem('is-dark-mode');
						if (legacy === 'yes') theme = 'dark';
						else if (legacy === 'no') theme = 'light';
						else theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
					}
				} catch (e) {}
				root.dataset.theme = theme;
				root.classList.add('js');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
